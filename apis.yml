aid: igent
name: iGent
description: 'iGent AI is a UK-based artificial intelligence company (Altrincham, Cheshire)
  building Maestro, an autonomous AI software-engineering agent. Maestro pairs adaptive
  autonomy with an ensemble of frontier AI models to plan, generate, test, and refine
  code across large multi-file codebases inside secure cloud sandboxes, letting developers
  start from scratch, upload existing code, or clone a repository. Founded by Sean Ward
  (CEO) and Martin Szummer (CTO), iGent AI is backed by HV Capital, XTX Markets Ventures,
  Twinpath VC, 10x Founders, and Dhyan VC. The product publishes developer documentation,
  a quick-start guide, integrations, skills, and a credits-based billing model. iGent
  was surfaced as a portfolio company of HV Capital and enriched into the API Evangelist
  network; it does not currently publish a first-party public REST API.'
